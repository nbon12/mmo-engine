name: Workflow tests

# Contract tests for this repo's GitHub workflows and harness infrastructure: tests/workflows/
# (specs 001-claude-mention-agent and 014-telemetry-test-harness).
on:
  pull_request:
    paths:
      - ".github/**"
      - "infra/**"
      - "tests/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "infra/**"
      - "tests/workflows/**"

permissions:
  contents: read

jobs:
  workflow-tests:
    name: workflow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: python3 -m pip install --user "pyyaml==6.0.2"

      - name: Run the tests
        run: python3 -m unittest discover -s tests/workflows -v
