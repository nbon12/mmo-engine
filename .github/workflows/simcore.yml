name: SimCore

# The shared simulation core's agreement suite (spec 015-shared-simulation-core, US2.7, FR-027).
#   agreement: publishes the prebuilt WebAssembly build (src/MmoEngine.SimCore.Wasm, no workload),
#              prepares a work directory with the 19 committed streams and 50 generated seeds
#              (`simcore agreement prepare`), runs the build in Node with the jiterpreter on and off
#              (tools/agreement/node/agreement.test.mjs) and in dedicated browser Workers
#              (tools/agreement/specs/worker.spec.mjs: Chromium always, Firefox and WebKit when they
#              install), and gates the pull request on `simcore agreement compare`, which exits non-zero
#              on any divergent step, any cross-build table mismatch or a required build that did not run.
# auto-merge.yml lists this workflow's name in its workflow_run trigger, so a pull request waits for it.
# tests/workflows/test_simcore_workflow.py pins this file.
on:
  pull_request:
    paths:
      - "src/MmoEngine.SimCore*/**"
      - "tests/MmoEngine.SimCore*/**"
      - "benchmarks/MmoEngine.SimCore*/**"
      - "tools/agreement/**"
      - "tools/simcore/**"
      - "simcore/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "MmoEngine.sln"
      - ".github/workflows/simcore.yml"
  push:
    branches: [main]
    paths:
      - "src/MmoEngine.SimCore*/**"
      - "tests/MmoEngine.SimCore*/**"
      - "benchmarks/MmoEngine.SimCore*/**"
      - "tools/agreement/**"
      - "tools/simcore/**"
      - "simcore/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "MmoEngine.sln"
      - ".github/workflows/simcore.yml"

permissions:
  contents: read

# bash with -o pipefail (GitHub's default `bash -e {0}` has none), so a failing command fails its step.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The runner class name (spec 014, research R5) and the pinned hardware-intrinsic settings, the same
  # as the Harness workflow's, so the server build here runs the same way it does in that runner class.
  MMO_RUNNER_CLASS: gha-ubuntu-latest-x64
  DOTNET_EnableAVX512F: "0"
  DOTNET_TieredPGO: "0"

jobs:
  agreement:
    name: agreement
    runs-on: ubuntu-latest
    # SC-006: the whole suite, the browser Worker run included, finishes in under 10 minutes.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The publish output's served root and a work directory that does not exist yet, which
      # `agreement prepare` requires. Every later step reads them from the environment.
      - name: Name the app and work directories
        run: |
          echo "AGREEMENT_APP=$RUNNER_TEMP/simcore-app/wwwroot" >> "$GITHUB_ENV"
          echo "AGREEMENT_WORK=$RUNNER_TEMP/agreement-work" >> "$GITHUB_ENV"

      # Against the prebuilt runtime pack: no workload is installed in this job.
      - name: Publish the WebAssembly build
        run: dotnet publish src/MmoEngine.SimCore.Wasm -c Release -o "$RUNNER_TEMP/simcore-app"

      - name: Prepare the agreement work directory (19 committed streams, 50 generated seeds)
        run: dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement prepare --seeds 1-50 --work "$AGREEMENT_WORK"

      - name: Install the runners' pinned Playwright
        working-directory: tools/agreement
        run: npm ci

      # Each Playwright step runs in tools/agreement, so npx runs the lockfile's 1.63.0 and installs the
      # browsers that version launches.
      - name: Install Chromium
        working-directory: tools/agreement
        run: npx playwright install --with-deps chromium

      # Firefox and WebKit are optional: a failed install skips their run, and compare reports them as
      # not run. A build that installs and then disagrees still fails the job.
      - name: Install Firefox
        id: firefox
        continue-on-error: true
        working-directory: tools/agreement
        run: npx playwright install --with-deps firefox

      - name: Install WebKit
        id: webkit
        continue-on-error: true
        working-directory: tools/agreement
        run: npx playwright install --with-deps webkit

      - name: Test the runners (tables comparison and agreement server)
        run: node --test tools/agreement/node/tables.test.mjs tools/agreement/node/server.test.mjs

      - name: Agreement in Node (jiterpreter on)
        env:
          AGREEMENT_BUILD: node-interp
        run: node --test tools/agreement/node/agreement.test.mjs

      - name: Agreement in Node (jiterpreter off)
        env:
          AGREEMENT_BUILD: node-interp-nojit
        run: node --test tools/agreement/node/agreement.test.mjs

      - name: Agreement in a Chromium Worker
        working-directory: tools/agreement
        run: npx playwright test --project chromium

      - name: Agreement in a Firefox Worker
        if: steps.firefox.outcome == 'success'
        working-directory: tools/agreement
        run: npx playwright test --project firefox

      - name: Agreement in a WebKit Worker
        if: steps.webkit.outcome == 'success'
        working-directory: tools/agreement
        run: npx playwright test --project webkit

      # The gate. It runs after a runner step failed too (not after a cancel), so the job summary and
      # the divergence reports name what disagreed. The default --require is node-interp,
      # node-interp-nojit and chromium-worker.
      - name: Compare every build with the server
        if: ${{ !cancelled() }}
        run: dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement compare --work "$AGREEMENT_WORK" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the agreement report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simcore-agreement-report
          path: ${{ runner.temp }}/agreement-work/report/
