name: SimCore

# The shared simulation core's agreement suite and measurements (spec 015-shared-simulation-core, US2.7,
# FR-027, US7).
#   agreement: publishes the prebuilt WebAssembly build (src/MmoEngine.SimCore.Wasm, no workload),
#              prepares a work directory with the 19 committed streams and 50 generated seeds
#              (`simcore agreement prepare`), runs the build in Node with the jiterpreter on and off
#              (tools/agreement/node/agreement.test.mjs) and in dedicated browser Workers
#              (tools/agreement/specs/worker.spec.mjs: Chromium always, Firefox and WebKit when they
#              install), and gates the pull request on `simcore agreement compare`, which exits non-zero
#              on any divergent step, any cross-build table mismatch or a required build that did not run.
#              Every step after the toolchain setup has its own timeout-minutes, so a step that hangs
#              fails on its own (a failure, not a cancel), and a failed required step skips the steps
#              after it up to compare. The optional Firefox and WebKit steps come after the required runs
#              and share one deadline, 7 minutes after the toolchain setup: an install or run that cannot
#              finish by then does not start, and one that would run past it is stopped. They therefore
#              end by the deadline whatever they do, and compare, which takes seconds, keeps the rest of
#              the job's 10 minutes (about 1 minute 50 seconds when the toolchain setup took a minute).
#   measure:   the measurement job (US7, FR-030, FR-031; contracts/measurement-report.md). It runs the
#              server benchmarks on the runner class, publishes the prebuilt interpreted build, installs
#              the wasm-tools workload and publishes the relinked and AOT builds, or records why it could
#              not produce each one. The relinked and AOT builds' Node agreement with the server gates
#              the job; the exhaustive trig sweeps write their ulp errors to the job summary without
#              gating. tools/agreement/lib/measure.mjs then measures each produced build's download,
#              cold starts and step costs in Node and in a Chromium Worker, `simcore measure
#              validate-report` checks the report's structure, the job log and summary show it, and it
#              is uploaded as the simcore-measurement artifact. No measured number is compared with a
#              threshold.
#              Every step after the toolchain setup has its own timeout-minutes, and the relinked and AOT
#              publishes bound `dotnet publish` with `timeout`, so a hang in an optional step (the
#              workload, a publish, the sweeps) is recorded inside the job's 30 minutes instead of
#              cancelling the job: an unproduced mode with its reason, or a sweep without its summary.
#              The agreement runs and compare run after an agreement run failed (not after a cancel), so
#              the job summary and the uploaded report name what disagreed.
# auto-merge.yml lists this workflow's name in its workflow_run trigger, so a pull request waits for it.
# tests/workflows/test_simcore_workflow.py pins this file.
on:
  pull_request:
    paths:
      - "src/MmoEngine.SimCore*/**"
      - "tests/MmoEngine.SimCore*/**"
      - "benchmarks/MmoEngine.SimCore*/**"
      - "tools/agreement/**"
      - "tools/simcore/**"
      - "simcore/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "MmoEngine.sln"
      - ".github/workflows/simcore.yml"
  push:
    branches: [main]
    paths:
      - "src/MmoEngine.SimCore*/**"
      - "tests/MmoEngine.SimCore*/**"
      - "benchmarks/MmoEngine.SimCore*/**"
      - "tools/agreement/**"
      - "tools/simcore/**"
      - "simcore/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "MmoEngine.sln"
      - ".github/workflows/simcore.yml"

permissions:
  contents: read

# bash with -o pipefail (GitHub's default `bash -e {0}` has none), so a failing command fails its step.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The runner class name (spec 014, research R5) and the pinned hardware-intrinsic settings, the same
  # as the Harness workflow's, so the server build here runs the same way it does in that runner class.
  MMO_RUNNER_CLASS: gha-ubuntu-latest-x64
  DOTNET_EnableAVX512F: "0"
  DOTNET_TieredPGO: "0"

jobs:
  agreement:
    name: agreement
    runs-on: ubuntu-latest
    # SC-006: the whole suite, the browser Worker run included, finishes in under 10 minutes.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The publish output's served root and a work directory that does not exist yet, which
      # `agreement prepare` requires, and the optional browsers' deadline in epoch seconds, 7 minutes
      # from here. Every later step reads them from the environment.
      - name: Name the app and work directories and the optional browsers' deadline
        timeout-minutes: 1
        run: |
          echo "AGREEMENT_APP=$RUNNER_TEMP/simcore-app/wwwroot" >> "$GITHUB_ENV"
          echo "AGREEMENT_WORK=$RUNNER_TEMP/agreement-work" >> "$GITHUB_ENV"
          echo "AGREEMENT_OPTIONAL_DEADLINE=$(( $(date +%s) + 7 * 60 ))" >> "$GITHUB_ENV"

      # Against the prebuilt runtime pack: no workload is installed in this job. The flag is what a
      # runner without the workload computes anyway; on an image that has wasm-tools it stops
      # InvariantGlobalization=true from relinking the runtime, so node-interp is always the prebuilt.
      - name: Publish the WebAssembly build
        timeout-minutes: 5
        run: dotnet publish src/MmoEngine.SimCore.Wasm -c Release -p:UsingBrowserRuntimeWorkload=false -o "$RUNNER_TEMP/simcore-app"

      - name: Prepare the agreement work directory (19 committed streams, 50 generated seeds)
        timeout-minutes: 4
        run: dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement prepare --seeds 1-50 --work "$AGREEMENT_WORK"

      - name: Install the runners' pinned Playwright
        timeout-minutes: 2
        working-directory: tools/agreement
        run: npm ci

      # Each Playwright step runs in tools/agreement, so npx runs the lockfile's 1.63.0 and installs the
      # browsers that version launches.
      - name: Install Chromium
        timeout-minutes: 4
        working-directory: tools/agreement
        run: npx playwright install --with-deps chromium

      - name: Test the runners (tables comparison, agreement server and record helpers)
        timeout-minutes: 2
        run: node --test tools/agreement/node/tables.test.mjs tools/agreement/node/server.test.mjs tools/agreement/node/runtime.test.mjs

      - name: Agreement in Node (jiterpreter on)
        timeout-minutes: 2
        env:
          AGREEMENT_BUILD: node-interp
        run: node --test tools/agreement/node/agreement.test.mjs

      - name: Agreement in Node (jiterpreter off)
        timeout-minutes: 2
        env:
          AGREEMENT_BUILD: node-interp-nojit
        run: node --test tools/agreement/node/agreement.test.mjs

      # Playwright's own 2-minute test timeout (playwright.config.mjs) ends a stalled run first, so its
      # failure and the Worker's events reach the log before the step's bound.
      - name: Agreement in a Chromium Worker
        timeout-minutes: 3
        working-directory: tools/agreement
        run: npx playwright test --project chromium

      # Firefox and WebKit are optional and come after the required runs. They share the deadline the
      # directories step set, so all four steps end by it (and `timeout`'s 10-second kill) and compare
      # keeps the rest of the job's 10 minutes. An install must end 160 s before the deadline, so its run
      # still has 150 s after the step change: it starts only with 30 s of that to spare and is stopped
      # when it runs out. One that fails, is stopped or does not start skips its run, and compare reports
      # that build as not run. A run starts only with 150 s left, more than Playwright's 2-minute test
      # timeout, so Playwright still reports a stalled run first; one that starts and then disagrees,
      # fails or is stopped at the deadline fails the job. Each step's own 3 minutes is a backstop.
      - name: Install Firefox
        id: firefox
        timeout-minutes: 3
        continue-on-error: true
        working-directory: tools/agreement
        run: |
          left=$(( ${AGREEMENT_OPTIONAL_DEADLINE:?is set by the directories step} - $(date +%s) - 160 ))
          if [ "$left" -lt 30 ]; then
            echo "::warning::no time to install Firefox and still leave its run 160 s before the optional browsers' deadline; compare reports firefox-worker as not run"
            exit 1
          fi
          timeout --kill-after=10s "${left}s" npx playwright install --with-deps firefox

      - name: Agreement in a Firefox Worker
        if: steps.firefox.outcome == 'success'
        timeout-minutes: 3
        working-directory: tools/agreement
        run: |
          left=$(( ${AGREEMENT_OPTIONAL_DEADLINE:?is set by the directories step} - $(date +%s) ))
          if [ "$left" -lt 150 ]; then
            echo "::warning::${left} s left before the optional browsers' deadline, under the 150 s a Firefox run needs; compare reports firefox-worker as not run"
            exit 0
          fi
          code=0
          timeout --kill-after=10s "${left}s" npx playwright test --project firefox || code=$?
          if [ "$code" -eq 124 ]; then
            echo "::error::the Firefox Worker run did not finish by the optional browsers' deadline"
          fi
          exit "$code"

      - name: Install WebKit
        id: webkit
        timeout-minutes: 3
        continue-on-error: true
        working-directory: tools/agreement
        run: |
          left=$(( ${AGREEMENT_OPTIONAL_DEADLINE:?is set by the directories step} - $(date +%s) - 160 ))
          if [ "$left" -lt 30 ]; then
            echo "::warning::no time to install WebKit and still leave its run 160 s before the optional browsers' deadline; compare reports webkit-worker as not run"
            exit 1
          fi
          timeout --kill-after=10s "${left}s" npx playwright install --with-deps webkit

      - name: Agreement in a WebKit Worker
        if: steps.webkit.outcome == 'success'
        timeout-minutes: 3
        working-directory: tools/agreement
        run: |
          left=$(( ${AGREEMENT_OPTIONAL_DEADLINE:?is set by the directories step} - $(date +%s) ))
          if [ "$left" -lt 150 ]; then
            echo "::warning::${left} s left before the optional browsers' deadline, under the 150 s a WebKit run needs; compare reports webkit-worker as not run"
            exit 0
          fi
          code=0
          timeout --kill-after=10s "${left}s" npx playwright test --project webkit || code=$?
          if [ "$code" -eq 124 ]; then
            echo "::error::the WebKit Worker run did not finish by the optional browsers' deadline"
          fi
          exit "$code"

      # The gate. It runs after a runner step failed too (not after a cancel), so the job summary and
      # the divergence reports name what disagreed. The default --require is node-interp,
      # node-interp-nojit and chromium-worker.
      - name: Compare every build with the server
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement compare --work "$AGREEMENT_WORK" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the agreement report
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simcore-agreement-report
          path: ${{ runner.temp }}/agreement-work/report/

  measure:
    name: measure
    runs-on: ubuntu-latest
    # The server benchmarks, three publishes, two agreement runs, the trig sweeps and the measurements.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The full run (FR-030). Main exits 2 without the runner class and 1 unless this run exported every
      # benchmark it ran, so the export the measure step reads is always this run's.
      - name: Run the server benchmarks
        timeout-minutes: 15
        run: dotnet run -c Release --project benchmarks/MmoEngine.SimCore.Benchmarks -- --filter '*'

      # Before the workload, and with the flag the agreement job publishes with, so this mode is the
      # build the agreement job tested as node-interp on any runner image.
      - name: Publish the prebuilt interpreted build
        timeout-minutes: 5
        run: dotnet publish src/MmoEngine.SimCore.Wasm -c Release -p:UsingBrowserRuntimeWorkload=false -o "$RUNNER_TEMP/publish/prebuilt"

      # A failed or timed-out install skips the relinked and AOT publishes, and the report records both
      # as not produced, with this step named as the reason (FR-031).
      - name: Install the wasm-tools workload
        id: install-workload
        timeout-minutes: 5
        continue-on-error: true
        run: dotnet workload install wasm-tools

      # Each publish records whether it produced its mode, and why not, and exits 0: a mode that cannot
      # be built is a report entry, not a failed job. `timeout` bounds the publish inside the step, so a
      # hang is recorded too (exit 124); the step's own bound is only a backstop.
      - name: Publish the relinked interpreted build
        id: publish-relinked
        if: steps.install-workload.outcome == 'success'
        timeout-minutes: 5
        run: |
          set +e
          timeout --kill-after=30s 4m dotnet publish src/MmoEngine.SimCore.Wasm -c Release -o "$RUNNER_TEMP/publish/relinked"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
            if [ "$code" -eq 124 ]; then
              echo "reason=dotnet publish did not finish within 4 minutes; see the publish-relinked step log" >> "$GITHUB_OUTPUT"
            else
              echo "reason=dotnet publish exited ${code}; see the publish-relinked step log" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0

      # Last of the three publishes: AOT leaves the assemblies it compiled, stripped of their IL, in the
      # project's obj folder, and an interpreted publish after it would copy them and fail at boot.
      - name: Publish the AOT build
        id: publish-aot
        if: steps.install-workload.outcome == 'success'
        timeout-minutes: 6
        run: |
          set +e
          timeout --kill-after=30s 5m dotnet publish src/MmoEngine.SimCore.Wasm -c Release -p:RunAOTCompilation=true -o "$RUNNER_TEMP/publish/aot"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
            if [ "$code" -eq 124 ]; then
              echo "reason=dotnet publish -p:RunAOTCompilation=true did not finish within 5 minutes; see the publish-aot step log" >> "$GITHUB_OUTPUT"
            else
              echo "reason=dotnet publish -p:RunAOTCompilation=true exited ${code}; see the publish-aot step log" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0

      # One fresh work directory for the agreement runs, compare and the measurements. AGREEMENT_WORK is
      # what agreement.test.mjs requires at load time.
      - name: Prepare the agreement work directory
        id: prepare
        timeout-minutes: 4
        run: |
          WORK="$(mktemp -d "$RUNNER_TEMP/simcore-work.XXXXXX")"
          dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement prepare --seeds 1-50 --work "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "AGREEMENT_WORK=$WORK" >> "$GITHUB_ENV"

      # The two runs and compare run after an earlier one failed (not after a cancel), as the agreement
      # job's compare does, so a relinked divergence does not hide the AOT result and compare still
      # writes the summary and report/. Without a prepared work directory none of them runs.
      - name: Agreement on the relinked build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.publish-relinked.outputs.produced == 'true' }}
        timeout-minutes: 3
        env:
          AGREEMENT_BUILD: node-interp-relinked
          AGREEMENT_APP: ${{ runner.temp }}/publish/relinked/wwwroot
        run: node --test tools/agreement/node/agreement.test.mjs

      - name: Agreement on the AOT build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.publish-aot.outputs.produced == 'true' }}
        timeout-minutes: 3
        env:
          AGREEMENT_BUILD: node-aot
          AGREEMENT_APP: ${{ runner.temp }}/publish/aot/wwwroot
        run: node --test tools/agreement/node/agreement.test.mjs

      # The gate for the builds this job produced (research.md R17): any divergence in the relinked or
      # AOT build fails the job. The prebuilt build's gate is the agreement job's.
      - name: Compare the new builds with the server
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (steps.publish-relinked.outputs.produced == 'true' || steps.publish-aot.outputs.produced == 'true') }}
        timeout-minutes: 3
        env:
          RELINKED_PRODUCED: ${{ steps.publish-relinked.outputs.produced }}
          AOT_PRODUCED: ${{ steps.publish-aot.outputs.produced }}
        run: |
          REQUIRE=""
          if [ "$RELINKED_PRODUCED" = "true" ]; then
            REQUIRE="node-interp-relinked"
          fi
          if [ "$AOT_PRODUCED" = "true" ]; then
            REQUIRE="${REQUIRE:+$REQUIRE,}node-aot"
          fi
          dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- agreement compare --work "$WORK" --require "$REQUIRE" --summary "$GITHUB_STEP_SUMMARY"

      # A measurement, not a gate: each function's maximum error in ulp goes to the job summary, and the
      # fixed trig table in the pull-request tests gates the error bounds (research.md R3).
      - name: Run the exhaustive math sweeps
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          MMO_EXHAUSTIVE_MATH=1 dotnet test tests/MmoEngine.SimCore.Tests -c Release --filter "FullyQualifiedName~MmoEngine.SimCore.Tests.Math" --logger "console;verbosity=detailed" | tee "$RUNNER_TEMP/sweeps.log" || status=$?
          {
            echo "## SimCore exhaustive math sweeps"
            echo
            grep -F 'SIMMATH ' "$RUNNER_TEMP/sweeps.log" | sed -e 's/^[[:space:]]*//' -e 's/^/    /' || echo "No SIMMATH line was printed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install the agreement tools
        timeout-minutes: 2
        working-directory: tools/agreement
        run: npm ci

      # In tools/agreement, so npx runs the lockfile's Playwright and installs the Chromium it launches.
      - name: Install Chromium
        timeout-minutes: 4
        working-directory: tools/agreement
        run: npx playwright install --with-deps chromium

      - name: Test the measurement runner
        timeout-minutes: 2
        run: node --test tools/agreement/node/measure.test.mjs tools/agreement/node/server.test.mjs

      # Each mode is passed exactly once: --mode with its publish folder when it was produced, else
      # --unproduced with its publish step's reason, or the workload's when the publish was skipped.
      - name: Measure the WebAssembly builds
        timeout-minutes: 8
        env:
          RELINKED_PRODUCED: ${{ steps.publish-relinked.outputs.produced }}
          RELINKED_REASON: ${{ steps.publish-relinked.outputs.reason }}
          AOT_PRODUCED: ${{ steps.publish-aot.outputs.produced }}
          AOT_REASON: ${{ steps.publish-aot.outputs.reason }}
        run: |
          WORKLOAD_REASON="dotnet workload install wasm-tools failed; see the install-workload step log"
          args=(--mode interp-prebuilt="$RUNNER_TEMP/publish/prebuilt")
          if [ "$RELINKED_PRODUCED" = "true" ]; then
            args+=(--mode interp-relinked="$RUNNER_TEMP/publish/relinked")
          else
            args+=(--unproduced interp-relinked="${RELINKED_REASON:-$WORKLOAD_REASON}")
          fi
          if [ "$AOT_PRODUCED" = "true" ]; then
            args+=(--mode aot="$RUNNER_TEMP/publish/aot")
          else
            args+=(--unproduced aot="${AOT_REASON:-$WORKLOAD_REASON}")
          fi
          node tools/agreement/lib/measure.mjs \
            --work "$WORK" \
            --server-benchmarks BenchmarkDotNet.Artifacts/results/simcore-server-benchmarks.json \
            "${args[@]}" \
            --out "$RUNNER_TEMP/simcore-measurement.json"

      # The measurement gate is structural only: every listed measurement with its unit, the runner
      # class and the build mode (US7 Independent Test, SC-007). No number is compared with a threshold.
      - name: Validate the measurement report
        timeout-minutes: 2
        run: dotnet run --project src/MmoEngine.SimCore.Cli -c Release -- measure validate-report "$RUNNER_TEMP/simcore-measurement.json"

      # The numbers in the job log and the job summary too, for a reader who cannot download the
      # artifact. It runs only after validation passed; valid JSON has no line that starts with `::`,
      # so the log reads no workflow command from it.
      - name: Show the measurement report
        timeout-minutes: 1
        run: |
          cat "$RUNNER_TEMP/simcore-measurement.json"
          {
            echo '### simcore-measurement'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/simcore-measurement.json"
            # The closing fence starts its own line, whether or not the file ends with a newline.
            if [ -n "$(tail -c 1 "$RUNNER_TEMP/simcore-measurement.json")" ]; then
              echo
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement report
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simcore-measurement
          path: ${{ runner.temp }}/simcore-measurement.json
          if-no-files-found: error

      # Only prepare puts WORK in the environment: after a failure before it, the path would be /report/,
      # so the upload needs a prepared work directory as well as a failed step.
      - name: Upload the agreement report
        if: ${{ failure() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simcore-measure-agreement-report
          path: ${{ env.WORK }}/report/
