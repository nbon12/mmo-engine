name: Claude

# Mention @claude in an issue, issue comment, PR review, or PR review comment and Claude
# Code works on it: answers questions, or pushes a branch and offers a PR link.
#
# Setup (one-time):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add ONE of these repository secrets:
#        CLAUDE_CODE_OAUTH_TOKEN  — Claude Pro/Max subscription (`claude setup-token`)
#        ANTHROPIC_API_KEY        — Anthropic Console API key (billed per token)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `opened` only: `assigned` would re-run Claude every time an old @claude issue is (re)assigned,
  # and the gate below checks the issue's author, not whoever assigned it.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only people with write access can trigger a run. The action also checks this, but gating here
    # means outsiders' mentions never start a job at all.
    #
    # Never on the Done story sweep's log issue (label `sweep-log`): agents post there as nbon12
    # (OWNER), so the author gate can't tell them from the owner, and a report that quotes a mention
    # would start a run (hoa_management_system#290). tests/workflows/ holds the tests for this gate.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.issue.labels.*.name, 'sweep-log')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        !contains(github.event.pull_request.labels.*.name, 'sweep-log')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        !contains(github.event.pull_request.labels.*.name, 'sweep-log')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        !contains(github.event.issue.labels.*.name, 'sweep-log'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time per issue or PR, never cancelling the one in progress. GitHub keeps at most
    # one run waiting per group: a newer mention replaces a waiting one, whose run is cancelled.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # No toolchains yet: the repo is specs and docs only. Add setup-dotnet / setup-node
      # here once the continent server and browser client land.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          # Whichever secret is set is used; leave the other unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 100
