version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (spec 001-claude-mention-agent FR-005).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The simulator image's .NET base images, pinned by digest (spec 014 FR-032, infra/sweeps/Dockerfile).
  - package-ecosystem: docker
    directory: /infra/sweeps
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Dependabot names an image from another registry by its path, without the registry (dotnet/sdk); both
      # spellings are listed so the rules hold either way.
      # The SDK follows global.json, which is bumped by hand with it.
      - dependency-name: dotnet/sdk
      - dependency-name: mcr.microsoft.com/dotnet/sdk
      # The runtime takes 10.0 patches only: a new major or minor is a target-framework change.
      - dependency-name: dotnet/runtime
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: mcr.microsoft.com/dotnet/runtime
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
