# OpenTelemetry Collector (contrib) for the harness (spec 014, FR-031). Logs and traces go to ClickHouse
# with create_schema: false (the repo's DDL owns otel_logs and otel_traces); metrics go to Prometheus,
# because the ClickHouse exporter is alpha for metrics.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 5000
    timeout: 1s
exporters:
  clickhouse:
    endpoint: tcp://${env:CLICKHOUSE_HOST}:9000?dial_timeout=10s
    database: default
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: false
    logs_table_name: otel_logs
    traces_table_name: otel_traces
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
