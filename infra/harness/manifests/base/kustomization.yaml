# The harness core (spec 014, FR-030): ClickHouse and the OpenTelemetry Collector in namespace
# `harness`. Chaos Mesh is installed by up.sh from its Helm chart. The credentials secret
# `clickhouse-credentials` is created by up.sh with a random password; it is never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harness
resources:
  - namespace.yaml
  - clickhouse.yaml
  - otel-collector.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=otel-collector-config.yaml
generatorOptions:
  disableNameSuffixHash: false
