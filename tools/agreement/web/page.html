<!doctype html>
<!--
  The Worker agreement page (spec 015, US2.2; contracts/wasm-api.md#worker-playwright).

  Opened as /web/page.html?build=<build> by specs/worker.spec.mjs, through the agreement server, which
  makes it cross-origin isolated. It starts the dedicated module Worker web/worker.mjs, posts `start`
  with the build and no runtime options, and appends every message the Worker posts to
  window.__agreement.events. It sets window.__agreement.done on `done` or `fatal`.

  A Worker that fails to load or throws outside its own handling (an `error` event), or a message that
  cannot be read (`messageerror`), is appended as a `fatal` event naming it, and ends the run too, so a
  broken Worker fails the spec at once with its message instead of at the test timeout.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SimCore agreement</title>
  </head>
  <body>
    <script type="module">
      const agreement = { events: [], done: false };
      window.__agreement = agreement;

      const build = new URLSearchParams(window.location.search).get('build');
      const worker = new Worker('./worker.mjs', { type: 'module' });

      function record(event) {
        agreement.events.push(event);
        if (event.type === 'done' || event.type === 'fatal') {
          agreement.done = true;
        }
      }

      worker.addEventListener('message', (message) => record(message.data));
      worker.addEventListener('error', (error) => {
        error.preventDefault();
        record({ type: 'fatal', message: `the Worker failed: ${error.message || 'it did not load'}` });
      });
      worker.addEventListener('messageerror', () => {
        record({ type: 'fatal', message: 'the Worker posted a message that could not be read' });
      });

      worker.postMessage({ type: 'start', build, runtimeOptions: [] });
    </script>
  </body>
</html>
